name: CGV 치이카와 예매 감시

on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: Telegram 테스트 알림만 보내기
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: cgv-chiikawa-${{ inputs.test_alert == true && 'test' || 'watch' }}
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 이전 알림 기록 복원
        if: ${{ inputs.test_alert != true }}
        uses: actions/cache@v4
        with:
          path: state.json
          key: cgv-state-${{ github.run_id }}
          restore-keys: |
            cgv-state-

      - name: 감시 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_INTERVAL_SECONDS: "60"
          PRIORITY_SITE_NOS: "0013,0059,0191"
          PRIORITY_DATES: ""
          PRIORITY_INTERVAL_SECONDS: "60"
          PRIORITY_OPEN_DATE_INTERVAL_SECONDS: "120"
          SOLD_OUT_INTERVAL_SECONDS: "60"
          REGULAR_INTERVAL_SECONDS: "180"
          OPEN_DATE_INTERVAL_SECONDS: "180"
          FAILED_RETRY_INTERVAL_SECONDS: "300"
          REQUEST_JITTER_MIN_SECONDS: "5"
          REQUEST_JITTER_MAX_SECONDS: "8"
          GLOBAL_BLOCK_BACKOFF_SECONDS: "300,900,3600"
          GLOBAL_BLOCK_ALERT_THRESHOLD: "2"
          MAX_SHOWTIME_REQUESTS: "1"
          MAX_OPEN_DATE_REQUESTS: "1"
          LOOP_MINUTES: "325"
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python check.py --test-alert
          else
            python check.py
          fi

      - name: 감시 중단 텔레그램 알림
        if: ${{ (failure() || cancelled()) && inputs.test_alert != true }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: |-
            🚨 CGV 감시가 중단되었습니다. 아래 실행 기록을 확인해주세요.
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
